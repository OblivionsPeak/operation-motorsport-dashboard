<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Standings | Operation Motorsport iRacing League</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>

  <nav class="nav">
    <a href="/" class="nav-logo">OPERATION <span>MOTORSPORT</span></a>
    <ul class="nav-links">
      <li><a href="/" class="active">Standings</a></li>
      <li><a href="/results">Results</a></li>
    </ul>
  </nav>

  <header class="page-header">
    <div class="container">
      <p class="page-label">iRacing League · #5403</p>
      <h1 class="page-title" id="season-title">STANDINGS</h1>
      <p class="page-subtitle" id="season-subtitle">Loading current season…</p>
    </div>
  </header>

  <section class="standings-section">
    <div class="container">

      <div class="section-header">
        <h2 class="section-title">Driver Standings</h2>
        <div style="display:flex;gap:10px;align-items:center;">
          <select class="season-select" id="season-select" style="display:none"></select>
          <button class="btn btn-ghost" id="refresh-btn" style="display:none">↻ Refresh</button>
        </div>
      </div>

      <div id="standings-wrap">
        <div class="loading">
          <div class="spinner"></div>
          <p>Loading standings…</p>
        </div>
      </div>

    </div>
  </section>

  <footer class="footer">
    <p>
      <a href="https://operationmotorsport.org" target="_blank" rel="noopener">operationmotorsport.org</a>
      &nbsp;·&nbsp; Data via iRacing Data API
    </p>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/standings.js"></script>
</body>
</html>
